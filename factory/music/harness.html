<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The music harness (Plan 2c Task 2; design 8.5 item 12): renders the writer's score.js offline. render.mjs seeds
         Math.random before this page loads and aborts every request outside this server's allowlist. -->
    <link rel="icon" href="data:," />
    <script src="/vendor/Tone.js"></script>
  </head>
  <body>
    <script type="module">
      function wav16(buffer) {  // 16-bit PCM, interleaved, clipped to [-1, 1]: deterministic, no dither
        const chans = [buffer.getChannelData(0), buffer.getChannelData(buffer.numberOfChannels > 1 ? 1 : 0)];
        const frames = buffer.length, bytes = new ArrayBuffer(44 + frames * 4), v = new DataView(bytes);
        const text = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
        text(0, "RIFF"); v.setUint32(4, 36 + frames * 4, true); text(8, "WAVEfmt ");
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
        v.setUint32(24, buffer.sampleRate, true); v.setUint32(28, buffer.sampleRate * 4, true);
        v.setUint16(32, 4, true); v.setUint16(34, 16, true); text(36, "data"); v.setUint32(40, frames * 4, true);
        for (let i = 0, o = 44; i < frames; i++) {
          for (const ch of chans) {
            const s = Math.max(-1, Math.min(1, ch[i]));
            v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
            o += 2;
          }
        }
        let bin = "";
        const u8 = new Uint8Array(bytes);
        for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode(...u8.subarray(i, i + 0x8000));
        return btoa(bin);
      }

      window.renderScore = async ({ duration, brief, samples }) => {
        const mod = await import("/score.js");
        if (!mod.meta || typeof mod.default !== "function") {
          throw new Error("score.js must export `meta` and a default async function compose()");
        }
        const buffer = await Tone.Offline(async ({ transport }) => {
          const piano = async () => {
            const s = new Tone.Sampler({ urls: samples, baseUrl: "/samples/" });
            await Tone.loaded();
            return s;
          };
          await mod.default({ Tone, brief, piano, transport });
          await Tone.loaded();
          transport.start(0);
        }, duration, 2, 48000);
        return { wav: wav16(buffer.get()), meta: JSON.parse(JSON.stringify(mod.meta)) };
      };
      window.harnessReady = true;
    </script>
  </body>
</html>
